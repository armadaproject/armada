apiPort: 10000
metricsPort: 9003
auth:
  anonymousAuth: true
corsAllowedOrigins:
  - "http://localhost:3000"
  - "http://localhost:8089"
  - "http://localhost:10000"
tls:
  enabled: false
  certPath: /certs/tls.crt
  keyPath: /certs/tls.key
postgres:
  connection:
    host: postgres
    port: 5433
    user: postgres
    password: psw
    dbname: lookouthc
    sslmode: disable
prunerConfig:
  expireAfter: 1008h # 42 days / 6 weeks
  deduplicationExpireAfter: 168h # 7 days
  timeout: 1h
  batchSize: 1000
uiConfig:
  backend: "jsonb"
  armadaApiBaseUrl: "http://armada-server:8080"
  customTitle: "Local Dev HC"
  userAnnotationPrefix: "armadaproject.io/"
  binocularsBaseUrlPattern: "http://armada-binoculars:8080"
  commandSpecs:
    - name: Logs
      template: "kubectl --context {{ runs[runs.length - 1].cluster }} -n {{ namespace }} logs -l armada_job_id={{ jobId }},armada_job_run_id={{ runs[runs.length - 1].runId }} --tail=-1"
      descriptionMd: Show the logs of the default container of the latest run. Add `-c <container>` for another container.
    - name: Exec
      template: "kubectl --context {{ runs[runs.length - 1].cluster }} -n {{ namespace }} exec -it $(kubectl --context {{ runs[runs.length - 1].cluster }} -n {{ namespace }} get pod -l armada_job_id={{ jobId }},armada_job_run_id={{ runs[runs.length - 1].runId }} -o name) -- /bin/sh"
      descriptionMd: Execute a command on the job's container. The command needs a POSIX shell or PowerShell.
      alertMessageMd: |
        The command works only while the container runs. Before the pod starts and after the executor deletes it, the command finds no pod.
      alertLevel: info
  pinnedTimeZoneIdentifiers:
    - America/New_York
    - Europe/London
    - Europe/Paris
    - Asia/Tokyo
    - Asia/Shanghai
    - America/Los_Angeles
    - America/Chicago
    - Australia/Sydney
    - Asia/Dubai
    - Asia/Kolkata
