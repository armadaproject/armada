image:
  repository: gresearch/armada-executor
  tag: latest
resources:
  limits:
    memory: 1Gi
    cpu: 300m
  requests:
    memory: 512Mi
    cpu: 200m
additionalLabels: {}
additionalClusterRoleBindings: []
additionalVolumeMounts: []
additionalVolumes: []
terminationGracePeriodSeconds: 5
nodeSelector: {}
# -- Tolerations
tolerations: []
customServiceAccount: null
serviceAccount: null
priorityClassName: ""

# Grant the executor constrained impersonation instead of the legacy `impersonate` verb.
# Only relevant when applicationConfig.kubernetes.impersonateUsers is true.
# Can significantly improve submit latency in clusters with many clusterrole bindings and
#  users have a large number of impersonated groups.
# Requires Kubernetes 1.34+ (with ConstrainedImpersonation feature gate enabled)
useConstrainedImpersonation: false

healthcheck:
  enabled: false

priorityClasses:
  - name: armada-default
    description: "Default priority class for pods created by Armada."
    globalDefault: false
    value: 1000
  - name: armada-preemptible
    description: "Priority class to be used for preemptible jobs."
    globalDefault: false
    value: 900

prometheus:
  enabled: false
  labels: {}
  scrapeInterval: 10s
  scrapeTimeout: 10s

applicationConfig:
  httpPort: 8080
  apiConnection:
    armadaUrl: ""
