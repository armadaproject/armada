apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lookout.name" . }}
  labels:
    {{- include "lookout.labels.all" . | nindent 4 }}
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    {{- include "lookout.migration.podTemplate" (dict "root" . "args" (list "--migrateDatabase") "resources" .Values.resources) | nindent 4 }}
