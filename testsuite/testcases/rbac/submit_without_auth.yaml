# RBAC: a context without authentication is unauthenticated
queue: e2e-test-queue
authContext: no-auth
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: sleep
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "ls"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
timeout: "100s"
expectedErrorCode: 16 # Unauthenticated

