# RBAC: a principal without preempt_any_jobs and without a queue-level preempt grant (rbac-user)
# cannot preempt a job, even one it submitted itself. Targets the shared plain rbac-queue;
# submission succeeds via the global submit_any_jobs: [admins, users] group mapping in
# config-auth.yaml, but the subsequent preempt is denied since rbac-user isn't in
# preempt_any_jobs and has no queue-level preempt grant.
queue: rbac-queue
authContext: rbac-user
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: cancel-by-id
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "sleep"
            - "15s"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
triggerEvent: running
preempt:
  request:
    reason: "Test job preemption for validation"
timeout: "100s"
expectedEvents:
  - submitted:
  - succeeded:
expectErrorCode: 2 # UNKNOWN
