# RBAC: a principal with the global preempt_any_jobs permission (rbac-admin) can preempt jobs
# in a queue it doesn't own. priorityClassName is set to armada-preemptible since
# priorityClassNameOverride: armada-default in config/scheduler/config.yaml would otherwise force
# the job onto the non-preemptible default class, and PreemptJobs only marks the run for
# preemption -- the scheduler only actually evicts it, producing the Preempted event this test
# waits for, if the job's priority class allows it.
queue: rbac-queue
authContext: rbac-admin
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      priorityClassName: armada-preemptible
      containers:
        - name: cancel-by-id
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "sleep"
            - "100s"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
triggerEvent: running
preempt:
  request:
    reason: "Test job preemption for validation"
timeout: "100s"
expectedEvents:
  - submitted:
  - preempted:
