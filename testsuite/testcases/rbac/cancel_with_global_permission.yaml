# RBAC: a principal with the global cancel_any_jobs permission can cancel jobs
# in a queue it doesn't own.
queue: e2e-test-queue
authContext: rbac-admin
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: cancel-by-id
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "sleep"
            - "100s"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
cancel:
  request: {}
timeout: "100s"
expectedEvents:
  - submitted:
  - cancelled:
