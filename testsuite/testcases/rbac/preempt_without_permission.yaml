# RBAC: a principal without preempt_any_jobs and without a queue-level preempt grant
# cannot preempt a job, even one it submitted itself.
queue: rbac-queue-submit-no-preempt
authContext: rbac-queue-only
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: cancel-by-id
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "sleep"
            - "100s"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
triggerEvent: running
preempt:
  request:
    reason: "Test job preemption for validation"
timeout: "100s"
expectedEvents:
  - submitted:
  - succeeded:
expectedErrorCode: 2 # UNKNOWN
queueConfig:
  setup:
    queueSpec:
      userOwners: ["nobody"]
      permissions:
        - subjects:
            - kind: Group
              name: queue-only
          verbs:
            - submit
            - watch
