# RBAC: a principal without the global cancel_any_jobs permission can cancel jobs
# in a queue it has the cancel permission.
queue: rbac-queue-submit-and-cancel
authContext: rbac-queue-only
numBatches: 5
batchSize: 5
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: cancel-by-id
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "sleep"
            - "100s"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
cancel:
  request: {}
timeout: "300s"
expectedEvents:
  - submitted:
  - cancelled:
queueConfig:
  setup:
    queueSpec:
      userOwners: ["nobody"]
      permissions:
        - subjects:
            - kind: Group
              name: queue-only
          verbs:
            - submit
            - cancel
            - watch
