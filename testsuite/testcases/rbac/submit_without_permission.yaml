# RBAC: a principal without submit_any_jobs and without a queue-level submit
# grant cannot submit jobs.
queue: rbac-queue-no-submit
authContext: rbac-queue-only
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: sleep
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "ls"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
timeout: "30s"
expectedErrorCode: 7 # PERMISSION_DENIED
queueConfig:
  setup:
    queueSpec:
      userOwners: ["nobody"]
