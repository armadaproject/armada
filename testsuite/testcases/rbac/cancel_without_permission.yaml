# RBAC: a principal without cancel_any_jobs and without a queue-level cancel grant
# cannot cancel a job, even one it submitted itself
queue: rbac-queue-submit-no-cancel
authContext: rbac-queue-only
numBatches: 10
batchSize: 10
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: cancel-by-id
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "sleep"
            - "100s"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
cancel:
  request: {}
expectedEvents:
  - submitted:
  - succeeded:
timeout: "30s"
expectErrorCode: 2 # UNKNOWN
queueConfig:
  setup:
    queueSpec:
      userOwners: ["nobody"]
      permissions:
        - subjects:
            - kind: Group
              name: queue-only
          verbs:
            - submit
            - watch
