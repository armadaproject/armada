# RBAC: a principal without watch_all_events and without a queue-level watch grant (rbac-user)
# cannot watch job-set events via GetJobSetEvents, even for a job it submitted itself. Targets
# the shared plain rbac-queue; submission succeeds via the global submit_any_jobs: [admins, users]
# group mapping in config-auth.yaml, but the GetJobSetEvents stream that Run() opens to watch for
# events is denied since rbac-user isn't in watch_all_events and has no queue-level watch grant.
queue: rbac-queue-no-watch
authContext: rbac-user
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: sleep
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "ls"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
timeout: "30s"
expectErrorCode: 7 # PERMISSION_DENIED
queueConfig:
  setup:
    queueSpec:
      userOwners: ["nobody"]
      permissions:
        - subjects:
            - kind: User
              name: users
          verbs:
            - submit
