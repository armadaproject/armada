# RBAC: a principal with the global submit_any_jobs permission (armada-admin) can submit to a
# queue it doesn't own.
queue: rbac-submit-with-perm
authContext: rbac-admin
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: sleep
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "ls"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
timeout: "100s"
expectedEvents:
  - submitted:
  - succeeded:
queueConfig:
  setup:
    # An explicit non-admin owner stops CreateQueue's auto-add-owner default (which would
    # otherwise make armada-admin the queue owner and let ownership -- not submit_any_jobs --
    # explain a successful submit).
    queueSpec:
      userOwners: ["nobody"]
