# RBAC: a principal without cancel_any_jobs and without a queue-level cancel grant (rbac-user)
# cannot cancel a job, even one it submitted itself. Targets the shared plain rbac-queue;
# submission succeeds via the global submit_any_jobs: [admins, users] group mapping in
# config-auth.yaml, but the subsequent cancel is denied since rbac-user isn't in cancel_any_jobs
# and has no queue-level cancel grant.
queue: rbac-queue
authContext: rbac-user
numBatches: 1
batchSize: 1
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: cancel-by-id
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "sleep"
            - "5s"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
cancel:
  request: {}
expectedEvents:
  - submitted:
  - succeeded:
timeout: "30s"
expectErrorCode: 2 # UNKNOWN
