# A plain nvidia.com/gpu request in a HAMi pool reserves the whole A10: all of
# its memory and compute.
numBatches: 1
batchSize: 1
queue: e2e-test-queue
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: workload
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          command:
            - sh
          args:
            - -c
            - sleep 5
          resources:
            limits:
              memory: 32Mi
              cpu: 50m
              nvidia.com/gpu: 1
            requests:
              memory: 32Mi
              cpu: 50m
              nvidia.com/gpu: 1
---
timeout: "180s"
expectedEvents:
  - submitted:
  - succeeded:
