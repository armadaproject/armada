## POST /v1/job/reprioritise
## Submit a low-priority job, reprioritise it upward, confirm a JobReprioritisedEvent fires
## 1x5

numBatches: 1
batchSize: 5
queue: e2e-test-queue
jobSetId: reprioritise_by_id
jobs:
  - namespace: default
    priority: 0
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      containers:
        - name: reprioritise-by-id
          imagePullPolicy: IfNotPresent
          image: alpine:3.20.0
          args:
            - "sleep"
            - "600s"
          resources:
            limits:
              memory: 25Mi
              cpu: 100m
            requests:
              memory: 25Mi
              cpu: 100m
---
### Reprioritise the job upward
triggerEvent: running
reprioritise:
  request:
    newPriority: 100
timeout: "100s"
expectedEvents:
  - submitted:
  - reprioritised:
