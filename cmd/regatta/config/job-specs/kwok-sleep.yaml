terminationGracePeriodSeconds: 0
restartPolicy: Never
nodeSelector:
  kwok.x-k8s.io/node: fake
tolerations:
  - key: kwok.x-k8s.io/node
    operator: Equal
    value: fake
    effect: NoSchedule
containers:
  - name: sleep
    imagePullPolicy: IfNotPresent
    image: alpine:3.21.3
    command:
      - sh
    args:
      - -c
      - sleep $(( (RANDOM % 60) + 100 ))
    resources:
      limits:
        memory: 64Mi
        cpu: 60m
      requests:
        memory: 64Mi
        cpu: 60m
