armadactl: ~/.armadactl.yaml                 # default: ~/.armadactl.yaml
authContext: ""                               # default: currentContext of the armadactl file

metrics:
  prometheus: http://localhost:9090           # default http://localhost:9090
  postRunDelay: 90s                           # default 90s
  reportInterval: 120s                        # default 120s; only continuous runs use it
  resultsPath: ../results/                    # default: the current directory

executionTargets:
  - name: gpu-cluster
    type: cluster
    nodeGroups:
      - gb200
    cluster:
      kubeconfig: ../../../../.kube/external/multicluster/cluster-1
      name: armada-cluster-1
      kind: true                              # default false
      internalApiServerAddress: https://armada-cluster-1-control-plane:6443   # default for kind: https://<name>-control-plane:6443
      evaluateReadiness: true                 # default true
      readinessRetries: 5                     # default 5
      readinessDelay: 5s                      # default 5s, doubled on each retry
      continueOnReadinessFailure: false       # default false
      readinessSelectsTarget: true            # default: the value of kind
      readyTimeout: 5m                        # default 5m
      nodeConcurrency: 50                     # default 50
      kubernetes:
        qps: 100                              # default 100
        burst: 200                            # default 200

  - name: cpu-cluster
    type: cluster
    nodeGroups:
      - cpu
    cluster:
      kubeconfig: ../../../../.kube/external/multicluster/cluster-2
      name: armada-cluster-2
      kind: true                              # default false
      internalApiServerAddress: https://armada-cluster-2-control-plane:6443   # default for kind: https://<name>-control-plane:6443
      evaluateReadiness: true                 # default true
      readinessRetries: 5                     # default 5
      readinessDelay: 5s                      # default 5s, doubled on each retry
      continueOnReadinessFailure: false       # default false
      readinessSelectsTarget: true            # default: the value of kind
      readyTimeout: 5m                        # default 5m
      nodeConcurrency: 50                     # default 50
      kubernetes:
        qps: 100                              # default 100
        burst: 200                            # default 200

nodeGroups:
  gb200:
    - nodeProfile: ../node-profiles/eks/p6e-gb200.36xlarge.yaml
      count: 300
  cpu:
    - nodeProfile: ../node-profiles/generic/cpu-only.yaml
      count: 200

load:
  queues:
    - prefix: tenant-                # 200 queues, tenant-001 ... tenant-200
      count: 200
      totalJobs: 20000
      minJobsPerQueue: 5             # default 1; every tenant gets at least this before the rest is spread
      distribution:                  # over queue numbers: a few busy tenants, a long tail
        type: lognormal
        mu: 3.0                      # ln of the queue number; mode is near e^(mu - sigma^2), about queue 7
        sigma: 1.0
      priorityFactor: 1              # default 1
      targets:                       # default: every target
        - gpu-cluster
        - cpu-cluster
      arrival:
        shape: gaussian              # over time: a burst in the middle of the 10m
        duration: 10m
        step: 10s                    # default 10s
        mean: 5m                     # default: the middle of the duration
        stddev: 90s                  # default: a sixth of the duration
      jobs:
        - jobSpec: ../job-specs/kwok-sleep.yaml
          share: 0.9
        - jobSpec: ../job-specs/gpu-job.yaml
          share: 0.1

    - prefix: batch-                 # 20 evenly loaded queues on the GPU cluster only
      count: 20
      totalJobs: 2000
      minJobsPerQueue: 1             # default 1
      distribution:
        type: uniform                # default uniform
      priorityFactor: 1              # default 1
      targets:
        - gpu-cluster
      arrival:
        shape: uniform               # default uniform
        duration: 10m
        step: 10s                    # default 10s
      jobs:
        - jobSpec: ../job-specs/gpu-job.yaml
          share: 1

    - prefix: urgent-                # one queue, submitted all at once
      count: 1                       # default 1; a single queue has no distribution
      totalJobs: 300
      minJobsPerQueue: 1             # default 1
      priorityFactor: 2              # default 1; at least 1, higher means lower priority
      targets:                       # default: every target
        - gpu-cluster
        - cpu-cluster
      arrival:
        shape: uniform               # default uniform
        duration: 0                  # default 0: everything at once
      jobs:
        - jobSpec: ../job-specs/kwok-sleep.yaml
          share: 1
