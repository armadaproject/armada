# Overlay on _local/scheduler/config.yaml (pass both to the scheduler, in that order).
# Lists replace rather than merge, so indexedNodeLabels repeats the base entry.
scheduling:
  indexedNodeLabels:
    - "kubernetes.io/hostname"
    - "armadaproject.io/fake-executor"
    - "kwok.x-k8s.io/node"
    - "armadaproject.io/regatta-target"
