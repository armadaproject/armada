# Two simultaneous cluster targets, each on its own kind cluster, with different node-group
# shapes. Bring up both clusters with `mage kindRegatta cmd/regatta/config/armada/kind/two-cluster`
# (mirrors `mage kind`, but skips the ingress-nginx/priorityclass/namespace install since
# Armada's own components run via goreman on the host, not inside either kind cluster).
armadactl: ~/.armadactl.yaml

metrics:
  prometheus: http://localhost:9090
  postRunDelay: 90s
  resultsPath: ./results/

executionTargets:
  - name: gpu-cluster
    type: cluster
    nodeGroups: [gb200]
    cluster:
      kubeconfig: ../../../.kube/external/regatta/regatta-1
      name: armada-regatta-1
      kind: true
      probeRetries: 5
      probeDelay: 5s

  - name: cpu-cluster
    type: cluster
    nodeGroups: [cpu]
    cluster:
      kubeconfig: ../../../.kube/external/regatta/regatta-2
      name: armada-regatta-2
      kind: true
      probeRetries: 5
      probeDelay: 5s

nodeGroups:
  gb200:
    - nodeProfile: node-profiles/gb200-slice.yaml
      count: 200
  cpu:
    - nodeProfile: node-profiles/cpu-only.yaml
      count: 100

load:
  queue: regatta
  jobSetId: two-cluster
  jobs:
    - jobSpec: job-specs/kwok-sleep.yaml
      count: 1000
