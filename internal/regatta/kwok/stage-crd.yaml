# The Stage CRD, required for kwok-controller's out-of-cluster mode. Source: https://github.com/kubernetes-sigs/kwok/blob/v0.7.0/kustomize/crd/bases/kwok.x-k8s.io_stages.yaml
apiVersion: apiextensions.k8s.io/v1
