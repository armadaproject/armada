name: Java Client

on:
  push:
    tags:
      - v*
    branches:
      - master
    paths:
      - 'client/java/**'
      - 'build/java-client/**'
      - 'pkg/api/*.proto'
      - '.github/workflows/java-client.yml'
      - 'scripts/build-java-client.sh'
      - 'makefile'
      - './magefiles/java.go'

  pull_request:
    branches-ignore:
      - gh-pages
    paths:
      - 'client/java/**'
      - 'build/java-client/**'
      - 'pkg/api/*.proto'
      - '.github/workflows/java-client.yml'
      - 'scripts/build-java-client.sh'
      - 'makefile'
      - './magefiles/java.go'

jobs:
  java-client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Restore Maven packages cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-mvn-build-${{ hashFiles('client/java/pom.xml') }}
          restore-keys:
            ${{ runner.os }}-mvn-build-${{ hashFiles('client/java/pom.xml') }}
            ${{ runner.os }}-mvn-build-

      - name: Run unit tests
        working-directory: client/java
        run: mvn --batch-mode test
