name: Release Python Client to PYPI

on:
  workflow_dispatch: {}

jobs:
  run-python-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/setup-go-cache
        with:
          cache-prefix: run-python-tests
      - name: Install Protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6 # v3.0.1
        with:
          version: "23.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/workflows/python-tests
        with:
          python-version: "3.10"
          tox-env: "py310"
          path: "client/python"
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: client/python/dist/
