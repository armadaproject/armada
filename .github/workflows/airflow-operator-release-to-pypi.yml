name: Release Airflow Operator to PYPI

on:
  workflow_dispatch: {}

jobs:
  run-python-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/setup-go-cache
        with:
          cache-prefix: run-python-tests
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '23.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: go run github.com/magefile/mage@v1.17.2 -v airflowOperator
      - uses: ./.github/workflows/python-tests
        with:
          python-version: '3.10'
          tox-env: 'py310'
          path: third_party/airflow
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: third_party/airflow/dist/
