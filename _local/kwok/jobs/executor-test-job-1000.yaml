numBatches: 1
batchSize: 1000
queue: e2e-test-queue
jobs:
  - priority: 0
    namespace: personal-anonymous
    podSpec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      tolerations:
        # Only relevant on KWOK as kind/Fake have no matching taint, so this is a no-op there.
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
      containers:
        - name: sleep
          imagePullPolicy: IfNotPresent
          image: alpine:3.16
          command:
            - sh
          args:
            - -c
            - sleep $(( (RANDOM % 60) + 100 )) # Readable by the fake executor, actually runs on kind, ignored by KWOK.
          resources:
            limits:
              memory: 32Mi
              cpu: "1"
            requests:
              memory: 32Mi
              cpu: "1"
---
timeout: "14400s"
expectedEvents:
  - submitted:
  - succeeded:
