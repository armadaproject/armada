# Fake-executor side of the KWOK comparison: same node shape and limits as
# _local/executor/kwok_config.yaml + gb200Slice. Layered on config.yaml via an extra --config.
nodes:
  - name: "fake-node"
    count: 1440 # keep in sync with KWOK_NODE_COUNT_DEFAULT (magefiles/kwok.go) or the comparison measures node count
    allocatable:
      cpu: "144"
      memory: "960Gi"
      ephemeral-storage: "256Gi"
      pods: "3000"
      nvidia.com/gpu: "4"
    labels:
      node.kubernetes.io/instance-type: "p6e-gb200.36xlarge"
    taints: []
application:
  maxLeasedJobs: 10000
  submitConcurrencyLimit: 1000
  updateConcurrencyLimit: 1000
task:
  jobLeaseRenewalInterval: 2s
