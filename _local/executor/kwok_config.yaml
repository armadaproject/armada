# Headroom overrides for KWOK perf runs. None measured as a bottleneck, concurrency tracks
# node capacity (KWOK_NODE_COUNT).
application:
  maxLeasedJobs: 10000 # base 100; per lease-request cycle, not total concurrent
  submitConcurrencyLimit: 1000 # base 10
  updateConcurrencyLimit: 1000 # base 10
task:
  jobLeaseRenewalInterval: 2s # base 5s
  allocateSpareClusterCapacityInterval: 1s # base 5s; keep <= jobLeaseRenewalInterval
